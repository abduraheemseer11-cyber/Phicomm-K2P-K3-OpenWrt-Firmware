name: K2P16 firmware compile

on:
  workflow_dispatch:

# إصلاح مشكلة 403 في الـ Release
permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: PhicommK2P/feeds.conf.default
  CONFIG_FILE: PhicommK2P/.config
  MOD_P1_SH: PhicommK2P/part1.sh
  MOD_P2_SH: PhicommK2P/part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialize build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3 python3-pip rsync unzip zlib1g-dev file wget
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds configuration
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $MOD_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$MOD_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom build configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $MOD_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$MOD_P2_SH

    - name: Download build dependencies
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Patch mt76 driver for Tx-Power
      run: |
        cd openwrt
        # تجهيز السائق لفك ضغطه في مجلد build_dir
        make package/kernel/mt76/prepare V=s
        
        # البحث عن ملف eeprom.c داخل build_dir
        TARGET_FILE=$(find build_dir -path "*/mt7615/eeprom.c" | head -n1)
        
        if [ -n "$TARGET_FILE" ] && [ -f "$TARGET_FILE" ]; then
          echo "Found eeprom.c at: $TARGET_FILE"
          # حقن return 24; بعد القوس الافتتاحي للدالة لتجاوز حد العتاد
          sed -i '/mt7615_eeprom_get_target_power_index(/,/^{/ s/{/{\n\treturn 24;/' "$TARGET_FILE"
          
          if grep -q 'return 24;' "$TARGET_FILE"; then
            echo "SUCCESS: mt76 target power patched (return 24)."
          else
            echo "ERROR: Failed to patch target file."
            exit 1
          fi
        else
          echo "ERROR: Could not locate mt7615/eeprom.c in build_dir."
          exit 1
        fi

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check disk space usage
      if: success()
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: success() && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: success() && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: success() && env.UPLOAD_FIRMWARE == 'true' && env.FIRMWARE != ''
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate Release tag
      id: tag
      if: success() && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=K2P16-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        touch release.txt

    - name: Publish to Release
      uses: softprops/action-gh-release@v1
      if: success() && env.UPLOAD_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Clean workspace
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.2
      if: success() && env.UPLOAD_RELEASE == 'true'
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
